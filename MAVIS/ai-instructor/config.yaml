# AI Flight Instructor - main configuration
sim:
  adapter: msfs          # mock | msfs | replay - overridden by: python main.py --sim <adapter>
  replay:                  # --sim replay: play a logged flight back as live telemetry.
                           # To test a new flight, overwrite these two files - nothing else changes:
    file: data/recordings/replay/flight.csv   # the logger's CSV export
    video: videos/replay.mp4                  # screen recording of the same flight (under web.media_dir);
                                              # prepared for the browser automatically on first start
    # session: <session_id> # pick one flight when the CSV holds several
  host: 127.0.0.1       # SIM PC's LAN IP (app runs on the laptop). Use 127.0.0.1 if same PC
  port: 500
  tick_hz: 10              # telemetry poll rate
  # Weather by chat/voice ("make it rain"). EXPERIMENTAL: MSFS may accept the
  # request and still not change the sky (MSFS 2020 largely ignores SimConnect
  # weather). method: theme calls SimConnect_WeatherSetModeTheme(<theme>) --
  # the names below are MSFS's weather-preset names; adjust if your sim uses
  # others. method: event fires a key event; simvar sets a variable; none = off.
  # Time of day needs no setup: it uses the sim clock events and is confirmed.
  weather:
    method: theme          # none | theme | event | simvar
    presets:               # canonical name -> trigger (theme, or event/value, or var/value)
      clear:  { theme: "Clear Skies" }
      cloudy: { theme: "Overcast" }
      rain:   { theme: "Rain" }
      storm:  { theme: "Storm" }
      fog:    { theme: "Fog" }
      snow:   { theme: "Snow" }

aircraft_profile: profiles/aircraft/c172sp_g1000.yaml
lesson: lessons/lesson01_pattern.yaml

input:
  mode: none               # overridden by: python main.py --input udp
                           # udp = hid_forwarder.py on sim PC (Warthog PTT + raw axes)
                           # local_hid = devices plugged into THIS machine
  udp_port: 6947
  profiles:                # used by local_hid mode only
    - profiles/devices/warthog_stick.yaml
    - profiles/devices/warthog_throttle.yaml
    - profiles/devices/virpil_rudder.yaml

coach:
  ollama_url: http://localhost:11434   # Ollama on this machine or WSL port-forward
  #ollama_url: http://192.168.0.107:11434 # Ollama on another PC (unreachable from this one)
  model: qwen2.5:7b-instruct
  timeout_s: 1.0           # fall back to template phrase beyond this
  min_speak_interval_s: 3  # gentleness vs latency: nudges wait at most this long
                           # (corrections/turn cues jump ahead at ~2 s)
  # Where Ollama runs the coach model. Keep the LLM on the GPU: on the CPU a 7B model
  # needs several seconds just to read the prompt. If MSFS leaves too little VRAM,
  # `ollama ps` shows e.g. "40%/60% CPU/GPU" and every answer slows down -- then use a
  # smaller model (qwen2.5:3b-instruct) or the laptop's Ollama, rather than the CPU.
  # num_gpu: -1            # layers on the GPU: -1 = all that fit, 0 = CPU only
  # num_thread: 8          # CPU threads, if num_gpu is 0

voice:
  engine: auto             # auto | kokoro | piper | pyttsx3 | none (auto falls back)
  # Splitting the work: MSFS + the LLM need the GPU most; Kokoro is small (82M) and
  # still several times faster than real time on the CPU, and MAVIS now plays each
  # sentence as soon as it's made. Set cuda if the log's "Kokoro on cpu, warm-up" is slow.
  tts_device: cpu          # auto | cuda | cpu
  tts_cpu_threads: 4       # 0 = torch default (all cores; leaves none for Whisper/the sim)
  output: tablet           # tablet (voice plays in the browser) | sim_pc (PC speakers)
  kokoro_voice: af_heart   # female MAVIS voice (Kokoro)
  piper_model: ""          # path to .onnx if using piper
  rate: 175                # pyttsx3 words/min
  sapi_voice: zira|female  # pyttsx3 fallback: prefer female Windows voice
  # --- STT / speaker enrolment (local; tablet mic) ---
  stt_model: small.en      # faster-whisper: base.en | small.en (fast, English) | medium | large-v3
                           # small.en ~0.2 s on the GPU, ~1-2 s on the CPU; medium ~10 s on the CPU
  stt_device: auto         # auto | cuda | cpu (falls back to cpu if the GPU fails)
  stt_compute: auto        # auto | float16 | int8 | float32  (auto: float16 GPU, int8 CPU)
  stt_cpu_threads: 4       # when on the CPU (0 = all cores)
  stt_initial_prompt: >-
    Student pilot asking questions during circuit training.
    Flaps, rudder, throttle, ailerons, stick, yoke, downwind, base leg,
    final approach, crosswind, airspeed, altitude, heading, runway, pattern.
  speaker_threshold: 0.35  # ECAPA cosine accept threshold (tune on device)
  enrol_seconds: 10        # UI capture length
  enrol_min_seconds: 2.0   # reject shorter / quieter captures
  voices_dir: data/voices  # local voice prints (json + embeddings)

web:
  host: 0.0.0.0            # tablet connects over LAN
  port: 6945
  media_dir: ../../frontend/public/media  # shared with the IRIS frontend (served at /media). avatar: intro_beginner.mp4, intro_training.mp4, idle.mp4
                           # videos: mock_video_beginner.mp4, mock_video_training.mp4
  theme:
    accent: blue           # blue | red | green | purple | amber | teal | pink,
                           # or any hex like "#4da3ff"
    success: green         # color for 'good/completed' (same choices)
    warning: amber         # color for cautions/flaps
  monitor_sources:         # video feeds of the trainee station (instructor monitor)
    # url examples: http://<ip>:8080/stream.mjpg (MJPEG), http://<ip>/video.mp4
    - { name: "Out the window", url: "" }
    - { name: "Left panel (PFD)", url: "" }
    - { name: "Right panel (MFD)", url: "" }

# Shared Postgres (same database IRIS uses). MAVIS only writes the sop_* tables
# (db/schema_sop_rules.sql). DATABASE_URL in the environment overrides this.
database:
  url: postgresql://postgres:postgres@localhost:5432/postgres

# SOP upload -> rules (sop/, docs/sop-rules.md). All local: Ollama + Tesseract.
sop:
  #ollama_url: http://localhost:11434   # Ollama on this machine or WSL port-forward
  ollama_url: http://192.168.0.107:11434 # CHANGE to LLM running the alptop
  model: qwen3.6:27b
  llm_timeout_s: 300       # per section; a 14B model on a 5090 takes ~20-60 s
  num_ctx: 8192            # context window for parsing (Ollama default 2048 is too small)
  think: false             # reasoning models (Qwen3.x, Gemma 4): keep thinking OFF for JSON output.
                           # "omit" = don't send the flag (very old Ollama builds)
  chunk_chars: 6000        # SOP text per LLM call
  pdf_dir: data/sop        # originals kept for the page-image view in the wizard
  tesseract_cmd: ""        # Windows: C:/Program Files/Tesseract-OCR/tesseract.exe (empty = on PATH)
  ocr_lang: eng
  check_circuit_flights: true   # check circuit / lesson flights against the rules live (Free Flight is
                                # always checked). The SOP Rules page's switch overrides this.
  aircraft_override: ""    # force the SOP of this profile id (e.g. c172sp_g1000) instead of
                           # detecting the aircraft loaded in the sim at lesson start

# Post-flight AI debrief in IRIS (Review -> Debrief, and a note per broken rule). IRIS reads
# this block on every call (no restart). Written by itself when a flight ends / Review is opened.
debrief:
  ollama_url: http://192.168.0.107:11434   # same Ollama as sop: above
  model: qwen3.6:27b       # a 14B model (e.g. qwen3:14b) writes a note several times faster
  think: false             # true = reason first: better notes, but minutes each on a 27B model
  timeout_s: 300           # give up if the model sends nothing for this long (incl. loading it)
  max_total_s: 900         # ... or one answer takes longer than this in all
  num_ctx: 8192            # same as sop: so Ollama doesn't reload the model (raised by itself if needed)
  num_predict: 1500        # answer length cap (thinking included)
  keep_alive: 30m          # keep the model loaded between notes
  auto_on_save: true       # write the summary + every broken-rule note after each flight
  max_auto_notes: -1       # -1 = a note for every broken-rule moment
  window_before_s: 30
  window_after_s: 30

instructor:
  pin: "123456"            # bootstrap PIN for first-run Iceman seed (see data/instructors.json)
