name: "Soft-Field Technique"
# Circuit Variations. Same circuit as Lesson 1, from runway 02 at Paya Lebar,
# with a soft-field take-off and a soft-field landing. The runway is concrete
# and MSFS can't make it soft, so this scores the TECHNIQUE (core/variations.py
# SoftField): nose wheel off early, lift off slow, accelerate in ground effect
# before climbing; touch down slow and nose high with a little power, hold the
# nose wheel off, light brakes.
variation: soft_field
soft_field:
  nose_up_pitch_deg: 4      # nose wheel counts as off above this pitch (on the ground)
  liftoff_max_kt: 52        # lift off at or below this
  ground_effect_agl_ft: 20  # stay this low after lift-off...
  accelerate_to_kt: 62      # ...until this speed (Vx), then climb
  touchdown_max_kt: 50      # touch down at or below this
  hold_nose_s: 4            # nose wheel held off this long after touchdown
# no "rotate now" call: the stick is back from the start of the roll
no_rotate_call: true
airport:
  icao: WSAP
  name: Paya Lebar Air Base
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 22.4
  threshold: { lat: 1.344640, lon: 103.903000 }   # RWY 02 threshold, OurAirports (runway 61 m wide)
  length_m: 3796
pattern:
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  crosswind_turn_agl_ft: 600
  centerline_offset_m: 0
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1

climb_speed_band_kt: [70, 90]
say:
  PHASE_ENTER_TAKEOFF_ROLL:
    layman: "Full power, stick all the way back, keep it straight with your feet."
    pilot: "Full power, full back elevator, centreline."
  PHASE_ENTER_CLIMB_OUT:
    layman: "Lovely, climbing away. Flaps up once we're above 200 feet, then 70 to 90 knots."
    pilot: "Positive climb. Flaps up above 200 feet, then 70 to 90 knots."
phases:
  - BRIEFING
  - PRE_TAKEOFF
  - TAKEOFF_ROLL
  - CLIMB_OUT
  - CROSSWIND
  - DOWNWIND
  - BASE
  - FINAL
  - FLARE_TOUCHDOWN
  - ROLLOUT
  - DEBRIEF
targets:
  TAKEOFF_ROLL:  { speed: null, note: "full back elevator, lift off when it flies" }
  CLIMB_OUT:     { speed: "{vy}", flaps: 0 }
  CROSSWIND:     { speed: "{vy}" }
  DOWNWIND:      { speed: "{pattern_downwind}", alt: 1100, flaps_abeam: 10 }
  BASE:          { speed: "{base}", flaps: 20 }
  FINAL:         { speed: "{final}", flaps: 30 }

briefing:
  layman: >-
    Soft-field technique. Imagine the runway is soft grass, where the nose
    wheel could dig in. For take-off: flaps ten, full power, stick all the way
    back to lift the nose wheel early, then stay just above the runway until
    the speed builds before you climb. We'll fly the rectangle, and for the
    landing, touch down as slowly as you can, nose high, and keep the nose
    wheel off.
  pilot: >-
    Soft-field take-off and landing, runway 02, one circuit. Flaps 10, full
    back elevator on the roll, lift off at minimum speed, accelerate in ground
    effect to Vx, then climb. Landing: full flaps, power through the flare,
    minimum-speed touchdown, nose wheel held off, minimum braking.

phase_notes:
  FINAL:
    layman: >-
      Soft-field landing coming up. Full flaps, {speed} knots. Keep a little
      power on through the flare, and touch down as slowly as you can.
    pilot: >-
      Full flaps, {speed} knots. Carry power through the flare, minimum-speed
      touchdown, nose high.
  FLARE_TOUCHDOWN:
    layman: >-
      Hold it off, nose up, a little power. Let it settle on gently.
    pilot: >-
      Hold it off, nose high, power on, settle on.
  ROLLOUT:
    layman: >-
      Keep the stick back to hold the nose wheel off, and go easy on the brakes.
    pilot: >-
      Full back elevator, nose wheel off as long as possible, minimum braking.

closing:
  layman: >-
    That's soft-field technique, take-off and landing. Gentle on the nose wheel
    all the way.
  pilot: >-
    Full stop. Soft-field take-off and landing complete.

debrief_summary: >-
  soft-field technique (from runway 02: a soft-field take-off -- nose wheel off
  early, lift off slow, accelerate just above the runway before climbing -- a
  circuit, and a soft-field landing -- slow nose-high touchdown with a little
  power, nose wheel held off, light brakes)

scoring:
  # (no standard "landing" score: it wants 65 kt at touchdown, soft-field wants slow)
  weights:    { track: 15, speed: 10, altitude: 10, landing: 0, smoothness: 5,
                soft_takeoff: 30, soft_landing: 30 }
  scales:     { track: 75, speed: 9, altitude: 120, smoothness: 0.22,
                land_sink: 300, land_center: 40, land_speed: 10 }
  grade_bands: [[88, "A"], [76, "B"], [64, "C"], [50, "D"]]
  retry_caps:  { "1": 85, "2": 78, "3": 70 }
  retry_cap_floor: 60
  final_length_m: 1100
