name: "Slow Flight & Stalls"
# Airborne lesson built on the familiarization engine (core/familiarization.py):
# same airborne start, up-front demo, to-do list, "look here" card and
# scorecard. `steps` picks this lesson's exercises; it ends after the last one.
# Straight & Level's "slow down" was ordinary slow cruise; this is flying near
# the stall, then the stall itself and the recovery.
type: familiarization

# Same airfield geometry as Lesson 1 -- used for the map and the runway the
# aircraft is put back on at the end.
airport:
  icao: WSAP
  name: Paya Lebar
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 22.4
  threshold: { lat: 1.344640, lon: 103.903000 }   # RWY 02 threshold, OurAirports (runway 61 m wide)
  length_m: 3796
pattern:                    # not flown; kept so shared map/scorer code has its keys
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  crosswind_turn_agl_ft: 600
  centerline_offset_m: 0    # threshold above is the real centreline; adjust only if the map reads off-centre when centred in the sim
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1

# Higher than the other lessons: a stall loses height.
airborne_start:
  bearing_from_field_deg: 180   # due south of Paya Lebar
  distance_nm: 3
  alt_msl_ft: 3500
  heading_true: 90
  ias_kt: 95
  throttle_pct: 70

steps:
  - SLOW_FLIGHT
  - STALL

exercises:
  slow_flight_kt: 55        # +/- 5 kt
  slow_flight_hold_s: 10
  height_band_ft: 200       # slow flight: height within +/- this counts
  stall_kt: 50              # stalled at or below this (or nose high and sinking)
  recover_kt: 65            # recovered: back above this, sink stopped
  step_timeout_s: 210

freeze_during_instructions: true

end_reposition:
  along_m: 60

debrief_summary: >-
  slow flight and stalls exercise (airborne start; flying slowly near the
  stall at a steady height, then a stall with power off and the recovery:
  nose down, full power, level off; no take-off or landing)

briefing:
  layman: >-
    Slow flight and stalls. We're up at about {alt} feet, south of Paya Lebar,
    higher than usual because a stall loses some height. First flying very
    slowly without losing height, then the stall itself, and how to get out of
    it. It sounds scary but it's very gentle in this aeroplane.
  pilot: >-
    Slow flight and stalls, airborne at {alt} feet south of Paya Lebar. Slow
    flight at 50 to 60 knots holding altitude, then a power-off stall and
    recovery.

# See lesson00_familiarization.yaml for the step_notes format. demo_layman /
# demo_pilot: what MAVIS says instead in the up-front demo, for a step the
# autopilot can't fly (core/demo.py DESCRIBE_ONLY).
step_notes:
  SLOW_FLIGHT:
    title: Slow flight
    todo:
      - "Power back, keep raising the nose to hold height"
      - "Settle at {sf_lo}-{sf_hi} kt, add a little power to stay there"
    look: [airspeed, altitude]
    layman: >-
      Slow flight: power back, raise the nose, and hold {sf_lo} to {sf_hi} knots without losing height.
    pilot: >-
      Slow flight, {sf_lo} to {sf_hi} knots, hold altitude.
  STALL:
    title: Stall and recover
    todo:
      - "Throttle to idle, keep raising the nose slowly"
      - "When it stalls: nose down, full power"
      - "Level off once the speed is back"
    look: [airspeed, attitude]
    layman: >-
      The stall: idle, ease the stick back until the nose drops. Then nose down, full power.
    pilot: >-
      Power-off stall, then recover: lower the nose, full power.
    demo_layman: >-
      The autopilot can't stall, so just listen: idle, stick back until the nose drops, then nose down, full power.
    demo_pilot: >-
      No autopilot demo: power-off stall, recover with nose down and full power.
