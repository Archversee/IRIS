name: "Steep Turns"
# Airborne lesson built on the familiarization engine (core/familiarization.py):
# same airborne start, up-front demo, to-do list, "look here" card and
# scorecard. `steps` picks this lesson's exercises; it ends after the last one.
# Flight Familiarization's turns were gentle (20 degrees); this lesson warms up
# at 30 degrees, then 45 degrees. The lesson is the bank: height isn't on the
# to-do list or scored (exercises.turn_height).
type: familiarization

# Same airfield geometry as Your First Circuit -- used for the map and the runway the
# aircraft is put back on at the end.
airport:
  icao: WSAP
  name: Paya Lebar
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 22.4
  threshold: { lat: 1.344640, lon: 103.903000 }   # RWY 02 threshold, OurAirports (runway 61 m wide)
  length_m: 3796
pattern:                    # not flown; kept so shared map/scorer code has its keys
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  crosswind_turn_agl_ft: 600
  centerline_offset_m: 0    # threshold above is the real centreline; adjust only if the map reads off-centre when centred in the sim
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1

airborne_start:
  bearing_from_field_deg: 180   # due south of Paya Lebar
  distance_nm: 3
  alt_msl_ft: 3000
  heading_true: 90
  ias_kt: 95
  throttle_pct: 70

steps:
  - MEDIUM_TURN_LEFT
  - MEDIUM_TURN_RIGHT
  - STEEP_TURN_LEFT
  - STEEP_TURN_RIGHT

exercises:
  medium_bank_deg: 30
  medium_turn_deg: 180      # a half circle
  steep_bank_deg: 45
  steep_turn_deg: 360       # a full circle
  turn_height: false        # the turns are about the bank alone: no height to hold
  step_timeout_s: 210

freeze_during_instructions: true

# The demo is only the first steps, so not "same steps"
say:
  FAM_DEMO_END:
    layman: "Your turn now. Start with the steps you just watched."
    pilot: "Your turn. Start with the same sequence."

end_reposition:
  along_m: 60

debrief_summary: >-
  steep turns exercise (airborne start; a half circle each way at 30 degrees
  of bank, then a full circle each way at 45 degrees; the bank is what's
  practised, height isn't scored; no take-off or landing)

briefing:
  layman: >-
    Steep turns. We're up at about {alt} feet, south of Paya Lebar. A warm-up
    half circle each way at 30 degrees, then a full circle each way at 45.
    Keep the bank steady all the way round.
  pilot: >-
    Steep turns, airborne at {alt} feet south of Paya Lebar. Medium turns at 30
    degrees, then 360s at 45 degrees.

# See basic05_familiarization.yaml for the step_notes format. The demo
# leaves out the 45-degree turns (core/demo.py NO_DEMO): they're
# explained when the trainee gets there.
step_notes:
  MEDIUM_TURN_LEFT:
    title: Medium turn left
    todo:
      - "Bank left {med_bank_lo}-{med_bank_hi}°"
      - "Roll level after a half circle"
    look: [attitude]
    layman: >-
      Medium turn left, {med_bank_lo} to {med_bank_hi} degrees of bank, half a circle.
    pilot: >-
      Medium turn left, {med_bank_lo} to {med_bank_hi} degrees, through 180.
  MEDIUM_TURN_RIGHT:
    title: Medium turn right
    todo:
      - "Bank right {med_bank_lo}-{med_bank_hi}°"
      - "Roll level after a half circle"
    look: [attitude]
    freeze: false
    layman: >-
      Same to the right, half a circle.
    pilot: >-
      Medium turn right, through 180.
  STEEP_TURN_LEFT:
    title: Steep turn left
    todo:
      - "Bank left {steep_bank_lo}-{steep_bank_hi}°, add some power"
      - "Roll level after a full circle"
    look: [attitude]
    layman: >-
      Steep turn left, {steep_bank_lo} to {steep_bank_hi} degrees of bank with a bit of power, a full circle.
    pilot: >-
      Steep turn left, {steep_bank_lo} to {steep_bank_hi} degrees through 360, add power.
  STEEP_TURN_RIGHT:
    title: Steep turn right
    todo:
      - "Bank right {steep_bank_lo}-{steep_bank_hi}°, add some power"
      - "Roll level after a full circle"
    look: [attitude]
    freeze: false
    layman: >-
      Same to the right, a full circle.
    pilot: >-
      Steep turn right, through 360.
