name: "Lesson 3: Straight & Level"
# Airborne lesson built on the familiarization engine (core/familiarization.py):
# same airborne start, to-do list, "look here" card, freeze-while-explaining
# and scorecard. `steps` picks this lesson's exercises.
type: familiarization

# Same airfield geometry as Lesson 1 -- used for the map, and as the target the
# trainee navigates back to at the end.
airport:
  icao: WSAP
  name: Paya Lebar
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 23.0
  threshold: { lat: 1.34470, lon: 103.90264 }
  length_m: 3780
pattern:                    # not flown; kept so shared map/scorer code has its keys
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  crosswind_turn_agl_ft: 600
  centerline_offset_m: 18
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1

airborne_start:
  bearing_from_field_deg: 180   # due south of Paya Lebar
  distance_nm: 3
  alt_msl_ft: 2500
  heading_true: 90
  ias_kt: 95
  throttle_pct: 70

# Attitude + power = performance: hold level at cruise, trim, then change
# speed without changing height.
steps:
  - STRAIGHT_LEVEL
  - TRIM
  - SLOW_CRUISE
  - FAST_CRUISE
  - FIND_AIRFIELD

exercises:
  straight_level_hold_s: 20
  altitude_band_ft: 150     # tighter than familiarization: this lesson is about holding it
  trim_hold_s: 10           # level, steady, stick near neutral
  slow_kt: 80
  fast_kt: 105
  speed_hold_s: 10          # seconds inside +/- 5 kt and the height band
  step_timeout_s: 150
  hint_every_s: 35

finish:
  pointing_within_deg: 15
  pointing_hold_s: 5
  pointing_max_nm: 10
  radius_nm: 2.0

freeze_during_instructions: true

end_reposition:
  along_m: 60

debrief_summary: >-
  straight and level exercise (airborne start; holding height wings level,
  trimming, then flying slower and faster at the same height, then finding
  Paya Lebar; no take-off or landing)

briefing:
  layman: >-
    Straight and level. We're up at about {alt} feet, south of Paya Lebar. The
    whole lesson is about keeping the height still while everything else
    changes. Follow the to-do list, top right.
  pilot: >-
    Straight and level, airborne at {alt} feet south of Paya Lebar. Attitude
    plus power equals performance. Trim, then speed changes at constant
    altitude.

# See lesson00_familiarization.yaml for the step_notes format.
step_notes:
  STRAIGHT_LEVEL:
    title: Straight & level
    todo:
      - "Wings level, nose on the horizon"
      - "Look out, then check the height"
    look: [attitude, altitude]
    layman: >-
      I'm holding us still. Keep the yellow plane level on the horizon line.
      Look outside mostly, and glance at the height now and then. Keep it
      between {alt_lo:,} and {alt_hi:,} feet for {hold_s} seconds.
    pilot: >-
      Straight and level, {alt_lo:,} to {alt_hi:,} feet. Lookout, attitude,
      instruments. Hold it {hold_s} seconds.
  TRIM:
    title: Trim it out
    todo:
      - "Hold the nose where it is"
      - "Roll the trim wheel until the stick feels light"
      - "Let go: it should stay level"
    look: [attitude, vsi]
    layman: >-
      Now let's make it easy. If you're pushing or pulling the stick, roll the
      trim wheel the same way until there's no pressure. Then let go. It should
      fly level on its own for {trim_s} seconds.
    pilot: >-
      Trim out the control pressure. Hold the attitude, trim, then hands off.
      Steady, no climb or descent, {trim_s} seconds.
  SLOW_CRUISE:
    title: Slow down, hold height
    todo:
      - "Throttle back a little"
      - "Raise the nose slowly as the speed drops"
      - "Re-trim at the new speed"
    look: [airspeed, altitude]
    layman: >-
      Now slower, but same height. Pull the throttle back a little. As we slow,
      the nose wants to drop, so raise it slowly to stay at the same height.
      Settle at {slow_lo} to {slow_hi} knots, then trim.
    pilot: >-
      Reduce power, maintain altitude, raise the attitude as the speed decays.
      {slow_lo} to {slow_hi} knots, re-trim.
  FAST_CRUISE:
    title: Speed up, hold height
    todo:
      - "Throttle forward"
      - "Lower the nose slowly as the speed builds"
      - "Re-trim at the new speed"
    look: [airspeed, altitude]
    freeze: false
    layman: >-
      Now faster, same height. Throttle forward, and ease the nose down a touch
      so we don't climb. Settle at {fast_lo} to {fast_hi} knots, then trim.
    pilot: >-
      Increase power, lower the attitude, hold altitude. {fast_lo} to
      {fast_hi} knots, re-trim.
  FIND_AIRFIELD:
    title: Find Paya Lebar & point at it
    todo:
      - "Look outside, not at the screen"
      - "Not Changi: that's the big one on the coast"
      - "Point the nose at it and hold"
    look: [outside]
    freeze: false
    layman: >-
      Last job: find Paya Lebar, around your {clock} o'clock, about {dist_nm}
      miles. Not Changi on the coast. Point the nose at it.
    pilot: >-
      Locate Paya Lebar, {clock} o'clock, {dist_nm} miles. Put it on the nose.
