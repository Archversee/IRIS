name: "Straight & Level, Climbs & Descents"
# Airborne lesson built on the familiarization engine (core/familiarization.py):
# same airborne start, up-front demo, to-do list, "look here" card and
# scorecard. `steps` picks this lesson's exercises; it ends after the last one
# (finding Paya Lebar is Flight Familiarization's job, not this lesson's).
# Straight & Level and Climbs & Descents in one lesson: the same idea --
# attitude + power = performance -- first at a steady height, then going up
# and down to a set height.
type: familiarization

# Same airfield geometry as Lesson 1 -- used for the map and the runway the
# aircraft is put back on at the end.
airport:
  icao: WSAP
  name: Paya Lebar
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 22.4
  threshold: { lat: 1.344640, lon: 103.903000 }   # RWY 02 threshold, OurAirports (runway 61 m wide)
  length_m: 3796
pattern:                    # not flown; kept so shared map/scorer code has its keys
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  crosswind_turn_agl_ft: 600
  centerline_offset_m: 0    # threshold above is the real centreline; adjust only if the map reads off-centre when centred in the sim
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1

airborne_start:
  bearing_from_field_deg: 180   # due south of Paya Lebar
  distance_nm: 3
  alt_msl_ft: 2500
  heading_true: 90
  ias_kt: 95
  throttle_pct: 70

# Wings level at cruise, trim it out, change speed; then climb to a set
# height and level off, descend to one and level off, and a power-off glide.
# Each step is judged on its own skill only.
steps:
  - STRAIGHT_LEVEL
  - TRIM
  - SLOW_CRUISE
  - FAST_CRUISE
  - CLIMB_TO
  - DESCEND_TO
  - GLIDE

exercises:
  straight_level_hold_s: 10 # seconds wings level
  altitude_band_ft: 150
  trim_hold_s: 10           # hands off the stick and steady...
  trim_max_vs_fpm: 500      # ...climbing or descending at under this
  slow_kt: 80               # slow down: 75-85 kt
  fast_kt: 105              # speed up: what the demo flies to
  fast_band_kt: [90, 120]   # speed up: anywhere in here counts
  speed_hold_s: 10          # seconds inside +/- 5 kt
  climb_to_ft: 500          # target = start height + this, a round hundred
  climb_speed_band_kt: [70, 90]   # climb and level off: any speed in here is fine
  descend_to_ft: 500
  level_band_ft: 100        # "levelled at the target" = within this
  level_hold_s: 5           # ...and steady there this long
  glide_kt: 68              # C172 best glide
  glide_band_kt: [60, 80]   # glide: any speed in here is fine
  glide_ft: 300             # glide down this far
  step_timeout_s: 210

freeze_during_instructions: true

end_reposition:
  along_m: 60

debrief_summary: >-
  straight and level, climbs and descents exercise (airborne start; wings
  level, trimming hands off, flying slower and faster, then climbing and
  descending to a set height and levelling off, and a power-off glide; no
  take-off or landing)

briefing:
  layman: >-
    Straight and level, climbs and descents. We're up at about {alt} feet,
    south of Paya Lebar. First I'll fly it for you: wings level, trimming,
    slowing down and speeding up, then climbing and descending to a set height,
    and a glide. Then it's your turn, following the to-do list, top right.
  pilot: >-
    Straight and level, climbs and descents, airborne at {alt} feet south of
    Paya Lebar. Attitude plus power equals performance. Demonstration first:
    trim, speed changes, level-offs at assigned altitudes, power-off glide.

# See lesson00_familiarization.yaml for the step_notes format.
step_notes:
  STRAIGHT_LEVEL:
    title: Straight & level
    todo:
      - "Wings level, nose on the horizon"
    look: [attitude]
    layman: >-
      Straight and level. Keep the yellow plane level on the horizon line,
      wings flat, for {hold_s} seconds. Look outside mostly.
    pilot: >-
      Straight and level. Wings level, nose on the horizon, lookout. Hold it
      {hold_s} seconds.
  TRIM:
    title: Trim it out
    todo:
      - "Roll the trim wheel until the stick feels light"
      - "Let go of the stick"
    look: [attitude, vsi]
    layman: >-
      Now let's make it easy. If you're pushing or pulling the stick, roll the
      trim wheel the same way until there's no pressure. Then let go, and it
      flies steady on its own for {trim_s} seconds.
    pilot: >-
      Trim out the control pressure, then hands off. Steady for {trim_s}
      seconds.
  SLOW_CRUISE:
    title: Slow down
    todo:
      - "Throttle back a little"
      - "Settle on the new speed"
    look: [airspeed]
    layman: >-
      Now slower. Pull the throttle back a little and let the speed come down
      to {slow_lo} to {slow_hi} knots on the left tape. Hold it there.
    pilot: >-
      Reduce power. {slow_lo} to {slow_hi} knots, hold it, re-trim.
  FAST_CRUISE:
    title: Speed up
    todo:
      - "Throttle forward"
      - "Settle on the new speed"
    look: [airspeed]
    freeze: false
    layman: >-
      Now faster. Push the throttle forward and let the speed build to
      {fast_lo} to {fast_hi} knots. Hold it there.
    pilot: >-
      Increase power. {fast_lo} to {fast_hi} knots, hold it, re-trim.
  CLIMB_TO:
    title: Climb and level off
    todo:
      - "Full power, nose up, {spd_lo}-{spd_hi} kt"
      - "About 50 ft before {tgt_alt:,}, ease the nose down"
      - "Power back to cruise, hold {tgt_alt:,} ft"
    look: [airspeed, altitude]
    layman: >-
      Climb to {tgt_alt:,} feet. Full power, raise the nose, and keep the speed
      at {spd_lo} to {spd_hi} knots. About fifty feet before {tgt_alt:,}, ease
      the nose down to level, then bring the power back. Stay on {tgt_alt:,}.
    pilot: >-
      Climb to {tgt_alt:,} feet at Vy. Lead the level-off by about fifty feet,
      attitude, power, trim. Hold {tgt_alt:,}.
  DESCEND_TO:
    title: Descend and level off
    todo:
      - "Power back a little, nose down gently"
      - "About 50 ft before {tgt_alt:,}, raise the nose to level"
      - "Power back to cruise, hold {tgt_alt:,} ft"
    look: [altitude, vsi]
    layman: >-
      Now down to {tgt_alt:,} feet. Pull the power back a little and let the
      nose come down gently. About fifty feet before {tgt_alt:,}, raise the nose
      to level and put the power back. Stay on {tgt_alt:,}.
    pilot: >-
      Descend to {tgt_alt:,} feet, around five hundred feet per minute. Lead
      the level-off by fifty feet, power, attitude, trim. Hold {tgt_alt:,}.
  GLIDE:
    title: Glide
    todo:
      - "Throttle to idle"
      - "Hold {glide_lo}-{glide_hi} kt with the nose"
    look: [airspeed, vsi]
    layman: >-
      Last one, the glide, as if the engine had stopped. Pull the throttle all
      the way back. Now the nose controls the speed: lower it to keep
      {glide_lo} to {glide_hi} knots. That's how far this aeroplane glides.
      Down about {glide_ft} feet.
    pilot: >-
      Power-off glide. Throttle idle, pitch for best glide, {glide_lo} to
      {glide_hi} knots. Note the rate of descent. Down {glide_ft} feet.
