name: "Take-off"
# The first piece of a circuit on its own: line up, full power, rotate, climb
# out straight ahead. Runs on the circuit engine (core/lesson_engine.py,
# phase_detector.py) with `segment: takeoff` -- the lesson ends on the climb-out
# at end_at_agl_ft, is scored on that alone, and the aircraft is then put back
# on the runway (end_reposition). Comes before Landing and Your First Circuit.
segment: takeoff
end_at_agl_ft: 1000
airport:
  icao: WSAP
  name: Paya Lebar Air Base
  elevation_ft: 65
runway:
  ident: "02"
  heading_true: 22.4
  threshold: { lat: 1.344640, lon: 103.903000 }   # RWY 02 threshold, OurAirports (runway 61 m wide)
  length_m: 3796
pattern:
  side: left
  altitude_msl_ft: 1100
  downwind_offset_nm: 0.8
  # above end_at_agl_ft on purpose: no "turn crosswind" call before the lesson ends
  crosswind_turn_agl_ft: 2000
  centerline_offset_m: 0    # threshold above is the real centreline; adjust only if the map reads off-centre when centred in the sim
  base_turn_past_abeam_m: 1100
  mock_base_turn_past_abeam_m: 1000
total_circuits: 1
phases:
  - BRIEFING
  - PRE_TAKEOFF
  - TAKEOFF_ROLL
  - CLIMB_OUT
  - DEBRIEF
targets:
  TAKEOFF_ROLL:  { speed: null }
  CLIMB_OUT:     { speed: null, flaps: 0 }

# No speed to fly in this lesson: MAVIS says when to lift the nose, and the
# climb is just "wings level, straight ahead" -- no knots shown, called or
# nudged on these legs.
no_speed_target: [CLIMB_OUT, CROSSWIND]

# MAVIS calls "lift off" at this speed -- and says it in every mode
# (Trainee/Pilot otherwise leave out most spoken callouts).
rotate_kt: 60
always_say: [ROTATE_NOW, ROTATE_LATE]

# This lesson's own wording for callouts that otherwise quote a speed.
say:
  # short: nothing should still be talking when the lift-off call comes
  PHASE_ENTER_TAKEOFF_ROLL:
    layman: "Full power. Keep it straight."
    pilot: "Full power, keep straight."
  ROTATE_NOW:
    layman: "That's flying speed. Gently ease the stick back and let her lift off."
    pilot: "Rotate."
  PHASE_ENTER_CLIMB_OUT:
    layman: "Lovely, we're airborne. Wings level, and keep climbing straight ahead."
    pilot: "Airborne. Positive climb, wings level, runway heading."

# To-do list in the pilot view: one row per stage, with live readouts.
todo_steps:
  - phases: [PRE_TAKEOFF, TAKEOFF_ROLL]
    title: Take-off roll
    todo:
      - "Throttle all the way forward, smoothly"
      - "Keep it straight with your feet"
      - "Ease the stick back when MAVIS says"
    meters: [speed]
  - phases: [CLIMB_OUT, CROSSWIND]
    title: Climb out
    todo:
      - "Wings level, straight ahead"
      - "Keep climbing to 1,000 ft"
    meters: [height_to]
todo_done: "Take-off done. After your score you're put back on the runway."

# Once scored (in the air at end_at_agl_ft): back on the runway centreline
# this far past the threshold, stopped, ready to go again.
end_reposition:
  along_m: 60

briefing:
  layman: >-
    Take-off. We're lined up on the runway at Paya Lebar. Push the throttle
    all the way forward and keep the nose straight with your feet; it likes
    to swing left, so a little right pedal. When I tell you, gently lift the
    nose, then climb straight ahead to about a thousand feet.
  pilot: >-
    Take-off, runway 02. Full power, centreline with rudder, rotate on my
    call, climb out on the runway heading to one thousand feet AGL.

# Teaching point for each leg, spoken after the standard phase call (or on its
# own in Trainee/Pilot modes).
# (No tip during the take-off roll: the lift-off call must not wait behind one.)
phase_notes:
  CLIMB_OUT:
    layman: >-
      We're flying. Keep the wings level and the nose just above the horizon.
      Straight ahead, nice and steady.
    pilot: >-
      Positive climb, wings level, runway heading.

closing:
  layman: >-
    And that's a take-off, flown by you. I'll put us back on the runway after
    your score.
  pilot: >-
    One thousand feet, take-off complete. Repositioning to the runway after the
    debrief.

debrief_summary: >-
  take-off (full power, keeping straight on the runway, lifting off when the
  instructor said, then climbing straight ahead to one thousand feet; no
  landing; there was no speed to fly, so don't mention one)

# Scored on climbing out roughly straight and smooth -- there's no speed to
# fly, and "straight" is generous (track scale 150 m).
scoring:
  weights:    { track: 50, speed: 0, altitude: 0, landing: 0, smoothness: 50 }
  scales:     { track: 150, speed: 8, altitude: 120, smoothness: 0.22,
                land_sink: 300, land_center: 40, land_speed: 10 }
  grade_bands: [[88, "A"], [76, "B"], [64, "C"], [50, "D"]]
  retry_caps:  { "1": 85, "2": 78, "3": 70 }
  retry_cap_floor: 60
